name: اپ اندروید (APK)

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "native-www/**"
      - "src/lib/native.ts"
      - "src/lib/live.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: نصب وابستگی‌ها
        run: npm ci --legacy-peer-deps

      - name: همگام‌سازی Capacitor
        run: npx cap sync android

      - name: کلید امضای ثابت (کش)
        # کلید در کش Actions نگه داشته می‌شود تا همه‌ی نسخه‌ها با یک امضا ساخته شوند
        # (در غیر این صورت نصب نسخه‌ی جدید روی قبلی خطای «conflicts with an existing package» می‌دهد)
        uses: actions/cache@v4
        with:
          path: ~/.hamdel-keystore
          key: hamdel-release-keystore-v1

      - name: آماده‌سازی کلید امضا
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          DIR="$HOME/.hamdel-keystore"
          mkdir -p "$DIR"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$DIR/release.p12"
            echo "$KS_PASS" > "$DIR/pass.txt"
            echo "${KS_ALIAS:-hamdel}" > "$DIR/alias.txt"
          elif [ ! -f "$DIR/release.p12" ]; then
            PASS="$(openssl rand -hex 24)"
            echo "$PASS" > "$DIR/pass.txt"
            echo "hamdel" > "$DIR/alias.txt"
            keytool -genkeypair -keystore "$DIR/release.p12" -storetype PKCS12 \
              -alias hamdel -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HAMDEL, OU=Shahed, O=Shahed School, C=IR" \
              -storepass "$PASS" -keypass "$PASS"
          fi
          {
            echo "HAMDEL_KEYSTORE=$DIR/release.p12"
            echo "HAMDEL_KEYSTORE_PASSWORD=$(cat "$DIR/pass.txt")"
            echo "HAMDEL_KEY_ALIAS=$(cat "$DIR/alias.txt")"
            echo "HAMDEL_KEY_PASSWORD=$(cat "$DIR/pass.txt")"
          } >> "$GITHUB_ENV"

      - name: ساخت APK انتشار (Release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: بررسی امضا
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "${BT}apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee /tmp/sig.txt
          grep -q "Android Debug" /tmp/sig.txt && { echo "امضای دیباگ!"; exit 1; } || true

      - name: ذخیره‌ی APK در خروجی همین اجرا
        uses: actions/upload-artifact@v4
        with:
          name: hamdel-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: انتشار در Release ثابت (فقط از main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hamdel.apk
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --prerelease --title "اپ اندروید هَمدِل" \
              --notes "آخرین نسخه‌ی اپ اندروید. فایل hamdel.apk را دانلود و نصب کنید."
          fi
          gh release upload android-latest hamdel.apk --clobber
          gh release edit android-latest --notes "آخرین ساخت: ${GITHUB_SHA::7} — نسخه‌ی ${GITHUB_RUN_NUMBER}"
